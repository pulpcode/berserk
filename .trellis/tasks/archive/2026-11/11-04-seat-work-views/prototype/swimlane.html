<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席位工作 · 泳道图方案</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#27312d;font-size:14px;--accent:#426354;--muted:#68746c;--line:#e1e7e3;--wash:#f5f8f6}
*{box-sizing:border-box}body{margin:0;background:#f6f8f7}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{background:#fff;border:1px solid var(--line);border-radius:7px;min-height:36px;padding:6px 12px}button:hover{background:#f4f7f5}svg{display:block}.preview{height:36px;padding:0 28px;display:flex;align-items:center;gap:12px;color:#62756a;background:#edf3ef;font-size:12px}.preview a{color:inherit;text-underline-offset:3px}.preview .sep{color:#b5c3ba}.preview .sample{margin-left:auto;color:#64766a}main{background:#fff;min-height:calc(100vh - 36px);padding-bottom:26px}h1{font-size:24px;line-height:36px;font-weight:600;margin:0;padding:22px 28px 18px;letter-spacing:-.5px}.tabs{display:flex;gap:28px;padding:0 28px;border-bottom:1px solid var(--line);color:#7a827e;font-size:13px;white-space:nowrap}.tabs span{padding:13px 0 15px}.tabs .active{color:var(--accent);font-weight:600;border-bottom:3px solid var(--accent)}.content{padding:22px 28px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:18px}.field{display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--muted);font-size:12px}.field select,.field input{border:1px solid var(--line);border-radius:7px;background:white;height:38px;padding:8px 10px;font-size:13px;color:#38423c;min-width:0}.field select{width:136px}.field.task select{width:164px}.field input{width:150px}.actions{display:flex;align-items:center;gap:10px}.icon{width:32px;height:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:6px}.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.switch{display:flex}.switch button{font-size:13px;border-radius:0;height:36px;min-width:58px}.switch button:first-child{border-radius:7px 0 0 7px}.switch button:last-child{border-radius:0 7px 7px 0;margin-left:-1px}.switch button[aria-pressed=true]{color:var(--accent);border-color:#b8cabe;background:#eaf0ec;position:relative;z-index:1;font-weight:500}.canvas{position:relative;height:570px;overflow:hidden;border:1px solid #dce4de;border-radius:12px;background:#fff;user-select:none;isolation:isolate}.canvas-tools{position:absolute;right:12px;top:12px;z-index:5;display:flex;padding:4px;gap:2px;border:1px solid var(--line);border-radius:8px;background:#ffffffee;box-shadow:0 2px 8px #283e3110}.canvas-tools button{border:0;color:#64736a}.scene{position:absolute;width:1118px;height:544px;left:0;top:0;transform-origin:0 0;touch-action:none}.lanes{position:absolute;inset:0;display:grid;grid-template-rows:repeat(4,136px)}.lane{position:relative;border-bottom:1px solid #e3e9e5;background:#fff}.lane:nth-child(even){background:#fafcfb}.lane:last-child{border-bottom:0}.lane-head{position:absolute;inset:0 auto 0 0;width:126px;border-right:1px solid #e1e7e3;background:#f5f8f6;display:flex;align-items:center;justify-content:center;gap:10px;color:#425b4d;font-size:15px;font-weight:600}.lane-head svg{width:20px;height:20px;fill:none;stroke:#788f80;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.scene>svg{position:absolute;inset:0;width:1118px;height:544px;pointer-events:none}.flow-line{fill:none;stroke:#7b9384;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#6f8d7a}.origin{position:absolute;width:34px;height:46px;border:0;padding:0;background:none;color:#64796c;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:6px;z-index:1}.origin:hover{background:#edf3ef}.origin .dot{width:13px;height:13px;border-radius:50%;background:#fff;border:1.7px solid #789785;box-shadow:inset 0 0 0 3.3px white}.origin .dot:after{display:block;content:"";width:4px;height:4px;background:#789785;border-radius:50%;margin:2.8px}.work{position:absolute;width:158px;height:86px;border:1px solid #d5e1d8;border-radius:9px;background:#fff;padding:13px 14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;justify-content:center;gap:10px;box-shadow:0 2px 5px #203b2c05;z-index:2}.work:hover,.work.selected{border-color:#84a28e;background:#f9fcfa;box-shadow:0 3px 10px #284a3420}.work strong{font-weight:550;font-size:15px;line-height:20px;color:#344d3e;white-space:nowrap}.status{font-size:12px;line-height:17px;padding:2px 6px;border-radius:4px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}.status:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}.status.assigned{background:#fbf4e6;color:#8b6826}.status.working{background:#eaf2f8;color:#426f8a}.status.submitted{background:#f0edf8;color:#745c95}.status.returned{background:#f9eee9;color:#9a674d}.status.completed{background:#eaf3ed;color:#557b61}.empty{padding:90px 24px;text-align:center;color:var(--muted)}.table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px;text-align:left;font-size:13px}td,th{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:500;color:var(--muted);background:#f8faf9}tr:last-child td{border:0}.work-link{border:0;background:none;padding:0;min-height:24px;color:var(--accent);font-weight:500}.work-link:hover{text-decoration:underline;background:none}td small{display:block;color:var(--muted);font-size:12px;margin-top:5px}dialog{border:1px solid var(--line);border-radius:12px;padding:24px;width:min(540px,90vw);max-height:80vh;color:#27312d}dialog::backdrop{background:#18271e55}.dialog-head{display:flex;align-items:flex-start;gap:20px;justify-content:space-between;margin-bottom:26px}dialog h2{font-size:19px;line-height:28px;margin:0;font-weight:600}dl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:18px;font-size:14px;margin:0}dt{color:var(--muted)}dd{margin:0}[hidden]{display:none!important}@media(max-width:1100px){.field select{width:118px}.field.task select{width:156px}.field input{width:140px}.toolbar{gap:12px 18px}}@media(prefers-reduced-motion:no-preference){.work{transition:border-color .12s,background-color .12s,box-shadow .12s}}
</style>
</head>
<body>
<div class="preview"><span>泳道图 · 方案预览</span><span class="sep">/</span><a href="seat-work-views.html">其他方案</a><span class="sample">示例数据</span></div>
<main>
<h1>工作总览</h1>
<nav class="tabs" aria-label="总览栏目结构示意"><span>研判记录</span><span class="active">席位工作</span><span>信息流转</span><span>处理运行</span><span>处理与投递规则</span><span>补充投递审批</span></nav>
<section class="content" aria-label="席位工作">
<div class="toolbar">
<label class="field task">工作任务<select id="task"><option value="道路通行保障">道路通行保障</option><option value="">全部公共任务</option><option>应急处置协调</option><option>物资与资源保障</option></select></label>
<label class="field">相关席位<select id="seat"><option value="">全部席位</option><option>总体席</option><option>情报席</option><option>筹划席</option><option>态势席</option></select></label>
<label class="field">工作状态<select id="state"><option value="">全部状态</option><option>待签收</option><option>办理中</option><option>待验收</option><option>已退回</option><option>已完成</option></select></label>
<label class="field">搜索工作<input id="search" type="search"></label>
<div class="actions"><button id="refresh" class="icon" title="刷新席位工作" aria-label="刷新席位工作"></button><div class="switch" role="group" aria-label="席位工作展示方式"><button id="list-view" aria-pressed="false">列表</button><button id="lane-view" aria-pressed="true">泳道图</button></div></div>
</div>
<div class="canvas" id="canvas" role="region" aria-label="席位工作泳道图">
<div class="canvas-tools" role="group" aria-label="泳道图控制"><button id="minus" class="icon" title="缩小" aria-label="缩小泳道图"></button><button id="plus" class="icon" title="放大" aria-label="放大泳道图"></button><button id="fit" class="icon" title="适应视图" aria-label="适应视图"></button></div>
<div id="scene" class="scene"></div>
</div>
<div id="list" hidden></div><div id="empty" class="empty" hidden>暂无符合条件的工作。</div>
</section>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" class="icon" aria-label="关闭" title="关闭"></button></div><div id="detail-body"></div></dialog>
<script>
const $=id=>document.getElementById(id), names={A:'总体席',B:'情报席',C:'筹划席',D:'态势席'};
const data=[{id:'w1',title:'整理处置资料',task:'道路通行保障',from:'A',to:'B',state:'待签收',status:'assigned'},{id:'w4',title:'核对道路保障安排',task:'道路通行保障',from:'B',to:'A',state:'待签收',status:'assigned'},{id:'w6',title:'完善备用路线方案',task:'道路通行保障',from:'A',to:'C',state:'办理中',status:'working'},{id:'w9',title:'更新现场道路态势',task:'道路通行保障',from:'A',to:'D',state:'待验收',status:'submitted'},{id:'w2',title:'核实现场联络方式',task:'应急处置协调',from:'A',to:'B',state:'已完成',status:'completed'},{id:'w8',title:'补充资源调配建议',task:'物资与资源保障',from:'C',to:'A',state:'已退回',status:'returned'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=path=>`<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
$('refresh').innerHTML=svg('<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/>');$('minus').innerHTML=svg('<path d="M5 12h14"/>');$('plus').innerHTML=svg('<path d="M5 12h14M12 5v14"/>');$('fit').innerHTML=svg('<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>');$('close').innerHTML=svg('<path d="m6 6 12 12M18 6 6 18"/>');
const seatIcon=svg('<rect x="5" y="3" width="14" height="10" rx="3"/><path d="M3 12v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5M7 19v3m10-3v3"/>');
let view='lane',scale=1,tx=0,ty=0,panning=null,width=1118;
const next=w=>w.state==='已完成'?'已完成':`${names[w.state==='待验收'?w.from:w.to]}${w.state==='待签收'?'签收':w.state==='待验收'?'验收':w.state==='已退回'?'修改':'办理'}`;
const matches=()=>data.filter(w=>(!$('task').value||w.task===$('task').value)&&(!$('seat').value||[names[w.from],names[w.to]].includes($('seat').value))&&(!$('state').value||w.state===$('state').value)&&w.title.includes($('search').value.trim()));
function openWork(id){const w=data.find(x=>x.id===id);$('detail-title').textContent=w.title;$('detail-body').innerHTML=`<dl><dt>所属任务</dt><dd>${esc(w.task)}</dd><dt>发起席位</dt><dd>${names[w.from]}</dd><dt>承办席位</dt><dd>${names[w.to]}</dd><dt>当前状态</dt><dd>${w.state}</dd><dt>下一步</dt><dd>${next(w)}</dd></dl>`;$('detail').showModal();}
function camera(){$('scene').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(){const c=$('canvas');scale=Math.max(.65,Math.min(1,(c.clientWidth-24)/width,(c.clientHeight-24)/544));tx=(c.clientWidth-width*scale)/2;ty=(c.clientHeight-544*scale)/2;camera()}
function zoomAt(f,x,y){const old=scale;scale=Math.max(.5,Math.min(1.8,scale*f));tx=x-(x-tx)*scale/old;ty=y-(y-ty)*scale/old;camera()}
function render(){const items=matches();width=Math.max(1118,150+items.length*242);const rows=Object.keys(names);$('canvas').hidden=view!=='lane'||!items.length;$('list').hidden=view!=='list'||!items.length;$('empty').hidden=!!items.length;$('list-view').setAttribute('aria-pressed',String(view==='list'));$('lane-view').setAttribute('aria-pressed',String(view==='lane'));
$('scene').style.width=width+'px';$('scene').innerHTML=`<div class="lanes">${rows.map(s=>`<div class="lane"><div class="lane-head">${seatIcon}<span>${names[s]}</span></div></div>`).join('')}</div><svg width="${width}" height="544" viewBox="0 0 ${width} 544" style="width:${width}px" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0 L7 3.5 L0 7 Z"/></marker></defs>${items.map((w,i)=>{const x=146+i*242,sy=68+rows.indexOf(w.from)*136,dy=68+rows.indexOf(w.to)*136;return `<path class="flow-line" data-line="${w.id}" d="M${x+12} ${sy} H${x+36} Q${x+44} ${sy} ${x+44} ${sy+(dy>sy?8:-8)} V${dy+(dy>sy?-8:8)} Q${x+44} ${dy} ${x+52} ${dy} H${x+58}" marker-end="url(#arrow)"/>`}).join('')}</svg>${items.map((w,i)=>{const x=146+i*242,sy=68+rows.indexOf(w.from)*136,dy=68+rows.indexOf(w.to)*136;return `<button class="origin" data-work="${w.id}" style="left:${x-5}px;top:${sy-14.5}px" aria-label="${names[w.from]}分派：${esc(w.title)}" title="${names[w.from]}发起：${esc(w.title)}"><span class="dot" aria-hidden="true"></span><span>分派</span></button><button class="work" data-work="${w.id}" style="left:${x+64}px;top:${dy-43}px" aria-label="${esc(w.title)}，${names[w.from]}分派给${names[w.to]}，${w.state}"><strong>${esc(w.title)}</strong><span class="status ${w.status}">${w.state}</span></button>`}).join('')}`;
$('list').innerHTML=`<div class="table-wrap"><table><thead><tr><th>工作</th><th>分派双方</th><th>当前状态</th><th>下一步</th><th>更新时间</th></tr></thead><tbody>${items.map(w=>`<tr><td><button class="work-link" data-work="${w.id}">${esc(w.title)}</button><small>${esc(w.task)}</small></td><td>${names[w.from]} → ${names[w.to]}</td><td>${w.state}</td><td>${next(w)}</td><td>2026/11/3 21:34:35</td></tr>`).join('')}</tbody></table></div>`;
for(const host of [$('scene'),$('list')])host.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openWork(b.dataset.work));camera();}
for(const id of ['task','seat','state','search'])$(id).addEventListener('input',()=>{render();if(view==='lane')fit()});$('refresh').onclick=render;$('list-view').onclick=()=>{view='list';render()};$('lane-view').onclick=()=>{view='lane';render();fit()};$('close').onclick=()=>$('detail').close();$('minus').onclick=()=>zoomAt(1/1.15,$('canvas').clientWidth/2,$('canvas').clientHeight/2);$('plus').onclick=()=>zoomAt(1.15,$('canvas').clientWidth/2,$('canvas').clientHeight/2);$('fit').onclick=fit;
$('canvas').addEventListener('wheel',e=>{if(e.target.closest('.canvas-tools'))return;e.preventDefault();const r=$('canvas').getBoundingClientRect(),dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?500:1);zoomAt(Math.exp(-Math.max(-100,Math.min(100,dy))*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});$('canvas').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;e.preventDefault();panning={x:e.clientX,y:e.clientY,tx,ty};$('canvas').setPointerCapture(e.pointerId)});$('canvas').addEventListener('pointermove',e=>{if(!panning)return;tx=panning.tx+e.clientX-panning.x;ty=panning.ty+e.clientY-panning.y;camera()});for(const t of ['pointerup','pointercancel'])$('canvas').addEventListener(t,()=>panning=null);window.addEventListener('resize',()=>{if(view==='lane')fit()});render();requestAnimationFrame(fit);
</script>
</body>
</html>
