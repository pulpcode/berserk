<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>席位工作 · 展示方案对比</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:14px;color:#252b32;--accent:#426354;--line:#e0e4e9;--muted:#6c7482}*{box-sizing:border-box}body{margin:0;background:#f7f8fa}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;min-height:36px;padding:6px 12px;background:white;cursor:pointer;font-size:13px}button:hover{background:#f3f6f4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #426354;outline-offset:3px}button[aria-pressed=true]{background:#e8eee9;color:#426354;border-color:#b9cbbf}.design-bar{background:#edf3ef;padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#426354;font-size:12px}.design-bar>span{margin-right:10px}.design-bar .options{display:flex;gap:8px;flex-wrap:wrap}.design-bar button{min-height:32px;font-size:12px}.shell{display:grid;grid-template-columns:190px minmax(0,1fr);background:white;min-height:850px}.sidebar{padding:26px 14px;background:#f7f8fa;border-right:1px solid var(--line)}.brand{font-size:28px;color:#203d31;margin:0 10px 28px}.nav{padding:13px 12px;margin-bottom:10px;border-radius:8px;display:block}.nav.active{background:#e8eee9;color:#426354}.section-label{color:var(--muted);margin:30px 12px 14px}.task-label{font-size:13px;margin:18px 12px}main{min-width:0}h1{font-size:24px;line-height:36px;letter-spacing:-.5px;margin:22px 26px 24px;font-weight:600}.tabs{display:flex;gap:26px;flex-wrap:wrap;padding:0 26px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.tabs span{padding:15px 0}.tabs .active{color:#426354;border-bottom:3px solid #426354;font-weight:600}.content{padding:20px 26px}.toolbar{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}.toolbar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}select,input{width:148px;min-width:0;height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:white;font-size:13px}input{width:170px}.view-actions{display:flex;gap:10px;align-items:center}.switch{display:flex}.switch button{border-radius:0;height:36px}.switch button:first-child{border-radius:7px 0 0 7px}.switch button:last-child{border-radius:0 7px 7px 0;margin-left:-1px}.icon{display:inline-flex;align-items:center;justify-content:center;width:32px;min-height:32px;height:32px;padding:0;border-radius:6px;background:white}.icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.canvas{position:relative;overflow:hidden;user-select:none;height:590px;min-height:480px;border:1px solid var(--line);border-radius:10px;background-color:#fafbfc;background-image:radial-gradient(#dce3df 1px,transparent 1px);background-size:20px 20px}.float-tools{position:absolute;right:12px;top:12px;display:flex;gap:3px;padding:4px;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px #253d3210;z-index:4}.float-tools .icon{border:0}.scene{position:absolute;left:0;top:0;width:780px;height:540px;transform-origin:0 0;touch-action:none}.scene>svg{position:absolute;inset:0;pointer-events:none}.connection{stroke:#95a69d;stroke-width:1.8;fill:none}.arrow{fill:#7e9187}.seat-node{position:absolute;width:140px;height:62px;border-color:#b6c8bc;background:#edf3ef;color:#355646;font-weight:600;font-size:15px}.edge-button{position:absolute;border-radius:16px;min-width:32px;min-height:30px;padding:3px 9px;font-size:12px;color:#426354;border-color:#bdccc3;box-shadow:0 1px 4px #253d3210}.seat-node.selected{outline:2px solid #426354;outline-offset:2px}.empty{padding:70px 16px;text-align:center;color:var(--muted)}.lane-scroll{overflow:auto}.lanes{display:grid;grid-template-columns:repeat(4,minmax(175px,1fr));gap:12px;min-width:736px}.lane{background:#f7f9f8;border:1px solid #e6ebe7;border-radius:9px;padding:12px}.lane h2{font-size:14px;font-weight:600;margin:0 0 14px}.work-card{background:white;border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:10px}.work-card:last-child{margin-bottom:0}.work-link{border:0;background:none;min-height:24px;padding:0;text-align:left;color:#426354;font-weight:500;line-height:1.5}.work-link:hover{background:none;text-decoration:underline}.work-card .status{display:inline-block;margin-top:9px}.work-card small{display:block;font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}.status{padding:3px 6px;border-radius:4px;background:#f1f4f3;color:#58635c;font-size:12px;white-space:nowrap}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{background:#f8f9fa;color:var(--muted);font-weight:500}td,th{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td,tr:last-child th{border-bottom:0}td small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.list-table{min-width:820px}.matrix{min-width:620px;text-align:center}.matrix th:first-child{text-align:left;min-width:170px}.matrix td{padding:22px 14px;vertical-align:middle}.matrix td button{min-width:48px;min-height:40px;color:#426354;background:#edf3ef;border-color:#d5e0d8}.matrix td button:hover{background:#dfeae3}.matrix .none{color:#a2aaa5}dialog{border:1px solid var(--line);border-radius:12px;width:min(620px,90vw);max-height:80vh;padding:24px;color:inherit}dialog::backdrop{background:#17231a55}.dialog-header{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:24px}.dialog-header h2{font-size:19px;margin:0}.dialog-work{padding:14px 0;border-bottom:1px solid var(--line)}.dialog-work:last-child{border-bottom:0}.dialog-work small{display:block;margin-top:6px;color:var(--muted)}dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;margin:0}dt{color:var(--muted)}dd{margin:0}[hidden]{display:none!important}@media(max-width:1100px){.shell{grid-template-columns:174px minmax(0,1fr)}.toolbar{gap:12px 16px}.tabs{gap:18px}.content{padding:20px}h1{margin-left:20px}.tabs{padding-left:20px}}
</style></head><body>
<div class="design-bar"><span>方案对比 · 合成数据 · 尚未实施</span><div class="options" role="group" aria-label="选择图形展示备选方案"><button data-kind="network" aria-pressed="true">A 紧凑关系图</button><button data-kind="lanes" aria-pressed="false">B 按席位分栏</button><button data-kind="matrix" aria-pressed="false">C 分派矩阵</button></div></div>
<div class="shell"><aside class="sidebar" aria-label="应用结构示意"><div class="brand">Axon</div><span class="nav">新建对话</span><span class="nav">工作待办</span><span class="nav active">工作总览</span><span class="nav">态势地图</span><div class="section-label">工作任务</div><div class="task-label">道路通行保障</div><div class="task-label">应急处置协调</div><div class="task-label">物资与资源保障</div><div class="section-label">个人空间</div></aside><main><h1>工作总览</h1><nav class="tabs" aria-label="总览栏目结构示意"><span>研判记录</span><span class="active">席位工作</span><span>信息流转</span><span>处理运行</span><span>处理与投递规则</span><span>补充投递审批</span></nav><section class="content" aria-label="席位工作">
<div class="toolbar"><label>工作任务<select id="task"><option value="">全部公共任务</option><option>道路通行保障</option><option>应急处置协调</option><option>物资与资源保障</option></select></label><label>相关席位<select id="seat"><option value="">全部席位</option><option>总体席</option><option>情报席</option><option>筹划席</option><option>态势席</option></select></label><label>工作状态<select id="state"><option value="">全部状态</option><option>待签收</option><option>办理中</option><option>待验收</option><option>已退回</option><option>已完成</option></select></label><label>搜索工作<input id="search" type="search"></label><div class="view-actions"><button id="refresh" class="icon" type="button" title="刷新席位工作" aria-label="刷新席位工作"></button><div class="switch" role="group" aria-label="席位工作展示方式"><button id="list-view" aria-pressed="false">列表</button><button id="graphic-view" aria-pressed="true">关系图</button></div></div></div>
<div id="list" hidden></div><div id="graphic"><div id="network" class="canvas" role="region" aria-label="席位分派关系图"><div class="float-tools" role="group" aria-label="关系图控制"><button id="minus" class="icon" title="缩小" aria-label="缩小关系图"></button><button id="plus" class="icon" title="放大" aria-label="放大关系图"></button><button id="fit" class="icon" title="适应视图" aria-label="适应视图"></button></div><div id="scene" class="scene"></div></div><div id="lanes" class="lane-scroll" hidden></div><div id="matrix" class="table-scroll" hidden></div></div><div id="empty" class="empty" hidden>暂无符合条件的工作。</div>
</section></main></div><dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title"></h2><button id="close" aria-label="关闭" class="icon" title="关闭"></button></div><div id="detail-body"></div></dialog>
<script>
const $=id=>document.getElementById(id),names={A:'总体席',B:'情报席',C:'筹划席',D:'态势席'},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=[{id:'w1',title:'整理处置资料',task:'道路通行保障',from:'A',to:'B',state:'待签收'},{id:'w2',title:'核实现场联络方式',task:'应急处置协调',from:'A',to:'B',state:'已完成'},{id:'w3',title:'复核新的道路来报',task:'道路通行保障',from:'A',to:'B',state:'办理中'},{id:'w4',title:'核对道路保障安排',task:'道路通行保障',from:'B',to:'A',state:'待签收'},{id:'w5',title:'复核物资清单',task:'物资与资源保障',from:'B',to:'A',state:'办理中'},{id:'w6',title:'完善备用路线方案',task:'道路通行保障',from:'A',to:'C',state:'办理中'},{id:'w7',title:'汇总联合处置意见',task:'应急处置协调',from:'A',to:'C',state:'已完成'},{id:'w8',title:'补充资源调配建议',task:'物资与资源保障',from:'C',to:'A',state:'已退回'},{id:'w9',title:'更新现场道路态势',task:'道路通行保障',from:'A',to:'D',state:'待验收'}];
const svg=path=>`<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
$('refresh').innerHTML=svg('<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/>');$('minus').innerHTML=svg('<path d="M5 12h14"/>');$('plus').innerHTML=svg('<path d="M5 12h14M12 5v14"/>');$('fit').innerHTML=svg('<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>');$('close').innerHTML=svg('<path d="m6 6 12 12M18 6 6 18"/>');
let kind='network',view='graphic',scale=1,tx=0,ty=0,panning=null,selected='';
const next=w=>w.state==='已完成'?'已完成':`${names[w.state==='待验收'?w.from:w.to]}${w.state==='待签收'?'签收':w.state==='待验收'?'验收':w.state==='已退回'?'修改':'办理'}`;
const matches=()=>data.filter(w=>(!$('task').value||w.task===$('task').value)&&(!$('seat').value||[names[w.from],names[w.to]].includes($('seat').value))&&(!$('state').value||w.state===$('state').value)&&w.title.includes($('search').value.trim()));
function openWork(id){const w=data.find(x=>x.id===id);$('detail-title').textContent=w.title;$('detail-body').innerHTML=`<dl><dt>所属任务</dt><dd>${esc(w.task)}</dd><dt>分派双方</dt><dd>${names[w.from]} → ${names[w.to]}</dd><dt>当前状态</dt><dd>${w.state}</dd><dt>下一步</dt><dd>${next(w)}</dd></dl>`;$('detail').showModal();}
function openGroup(from,to,items=matches()){const rows=items.filter(w=>w.from===from&&w.to===to);$('detail-title').textContent=`${names[from]} → ${names[to]}`;$('detail-body').innerHTML=rows.map(w=>`<article class="dialog-work"><button class="work-link" data-detail-work="${w.id}">${esc(w.title)}</button><small>${esc(w.task)} · ${w.state} · ${next(w)}</small></article>`).join('');$('detail-body').querySelectorAll('[data-detail-work]').forEach(b=>b.onclick=()=>{$('detail').close();openWork(b.dataset.detailWork)});$('detail').showModal();}
const nodes={A:[320,60],B:[60,240],C:[580,240],D:[320,420]};
const edges=[{f:'A',t:'B',p:'M320 106 C255 120 245 225 200 256',x:232,y:160},{f:'B',t:'A',p:'M200 282 C300 285 278 172 320 131',x:279,y:247},{f:'A',t:'C',p:'M460 106 C525 120 535 225 580 256',x:515,y:160},{f:'C',t:'A',p:'M580 282 C480 285 502 172 460 131',x:465,y:247},{f:'A',t:'D',p:'M390 122 L390 420',x:374,y:320}];
function camera(){$('scene').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fit(){const area=$('network');scale=Math.min(1.2,Math.max(.55,Math.min((area.clientWidth-30)/780,(area.clientHeight-30)/540)));tx=(area.clientWidth-780*scale)/2;ty=(area.clientHeight-540*scale)/2;camera();}
function zoomAt(factor,x,y){const old=scale;scale=Math.min(2,Math.max(.55,scale*factor));tx=x-(x-tx)*scale/old;ty=y-(y-ty)*scale/old;camera();}
function render(){const items=matches(),active=new Set(items.flatMap(w=>[w.from,w.to]));$('empty').hidden=!!items.length;$('list').hidden=view!=='list'||!items.length;$('graphic').hidden=view!=='graphic'||!items.length;for(const k of ['network','lanes','matrix'])$(k).hidden=k!==kind;$('list-view').setAttribute('aria-pressed',String(view==='list'));$('graphic-view').setAttribute('aria-pressed',String(view==='graphic'));$('graphic-view').textContent={network:'关系图',lanes:'席位分栏',matrix:'分派矩阵'}[kind];document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));
$('list').innerHTML=`<div class="table-scroll"><table class="list-table"><thead><tr><th>工作</th><th>分派双方</th><th>当前状态</th><th>下一步</th><th>更新时间</th></tr></thead><tbody>${items.map(w=>`<tr><td><button class="work-link" data-work="${w.id}">${esc(w.title)}</button><small>${esc(w.task)}</small></td><td>${names[w.from]} → ${names[w.to]}</td><td>${w.state}</td><td>${next(w)}</td><td>2026/11/3 21:34:35</td></tr>`).join('')}</tbody></table></div>`;
const links=edges.map(e=>({...e,rows:items.filter(w=>w.from===e.f&&w.to===e.t)})).filter(e=>e.rows.length);
$('scene').innerHTML=`<svg width="780" height="540" aria-hidden="true"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 Z"/></marker></defs>${links.map(e=>`<path class="connection" d="${e.p}" marker-end="url(#arr)" style="opacity:${(selected && ![e.f,e.t].includes(selected)) ? 0.25 : 1}"/>`).join('')}</svg>${[...active].map(n=>`<button class="seat-node ${selected===n?'selected':''}" aria-pressed="${selected===n}" data-node="${n}" style="left:${nodes[n][0]}px;top:${nodes[n][1]}px">${names[n]}</button>`).join('')}${links.map(e=>`<button class="edge-button" data-pair="${e.f}-${e.t}" title="${names[e.f]}分派给${names[e.t]}的工作" aria-label="${names[e.f]}分派给${names[e.t]}，${e.rows.length}项工作" style="left:${e.x}px;top:${e.y}px">${e.rows.length}</button>`).join('')}`;
$('lanes').innerHTML=`<div class="lanes">${Object.keys(names).map(seat=>`<section class="lane" aria-label="${names[seat]}承办的工作"><h2>${names[seat]}</h2>${items.filter(w=>w.to===seat).map(w=>`<article class="work-card"><button class="work-link" data-work="${w.id}">${esc(w.title)}</button><small>发起：${names[w.from]}</small><small>${esc(w.task)}</small><span class="status">${w.state}</span></article>`).join('')}</section>`).join('')}</div>`;
$('matrix').innerHTML=`<table class="matrix"><thead><tr><th>发起席位 ＼ 承办席位</th>${Object.values(names).map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${Object.keys(names).map(f=>`<tr><th>${names[f]}</th>${Object.keys(names).map(t=>{const n=items.filter(w=>w.from===f&&w.to===t).length;return `<td>${n?`<button data-pair="${f}-${t}" aria-label="${names[f]}分派给${names[t]}，${n}项工作">${n}</button>`:'<span class="none">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
for(const host of [$('list'),$('lanes')])host.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openWork(b.dataset.work));for(const host of [$('scene'),$('matrix')])host.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>openGroup(...b.dataset.pair.split('-')));$('scene').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.node?'':b.dataset.node;render();$('scene').querySelector(`[data-node="${b.dataset.node}"]`).focus()});camera();}
for(const id of ['task','seat','state','search'])$(id).addEventListener('input',()=>{selected='';render()});$('list-view').onclick=()=>{view='list';render()};$('graphic-view').onclick=()=>{view='graphic';render();if(kind==='network')fit()};$('refresh').onclick=render;$('close').onclick=()=>$('detail').close();document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;view='graphic';render();if(kind==='network')fit()});$('plus').onclick=()=>zoomAt(1.15,$('network').clientWidth/2,$('network').clientHeight/2);$('minus').onclick=()=>zoomAt(1/1.15,$('network').clientWidth/2,$('network').clientHeight/2);$('fit').onclick=fit;
$('network').addEventListener('wheel',e=>{if(e.target.closest('.float-tools'))return;e.preventDefault();const r=$('network').getBoundingClientRect();const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?500:1);zoomAt(Math.exp(-Math.max(-100,Math.min(100,dy))*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});$('network').addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;panning={x:e.clientX,y:e.clientY,tx,ty};$('network').setPointerCapture(e.pointerId)});$('network').addEventListener('pointermove',e=>{if(!panning)return;tx=panning.tx+e.clientX-panning.x;ty=panning.ty+e.clientY-panning.y;camera()});for(const type of ['pointerup','pointercancel'])$('network').addEventListener(type,()=>panning=null);render();requestAnimationFrame(fit);
</script></body></html>
