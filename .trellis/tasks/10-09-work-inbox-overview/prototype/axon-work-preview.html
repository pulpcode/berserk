y:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;font-weight:500}#axon-work-preview .ax-session{margin:2px 0 2px 13px;padding:9px 11px;width:calc(100% - 13px);border-radius:7px;display:grid;gap:3px;font-size:12px}#axon-work-preview .ax-sessiontitle{display:flex;align-items:center;justify-content:space-between;gap:6px}#axon-work-preview .ax-sessionstate{color:var(--ax-muted);font-size:11px;display:flex;align-items:center;gap:6px}#axon-work-preview .ax-green{color:var(--ax-accent)}#axon-work-preview .ax-amber{color:var(--ax-warn)}#axon-work-preview .ax-dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:currentColor;flex-shrink:0}#axon-work-preview .ax-blue{color:var(--ax-blue)}#axon-work-preview .ax-seat{margin-top:auto;border-top:1px solid var(--ax-line);padding:14px 8px 0}#axon-work-preview .ax-seat label{display:block;font-size:11px;color:var(--ax-muted);margin-bottom:6px}#axon-work-preview select{width:100%;border:1px solid var(--ax-line);border-radius:6px;background:var(--ax-bg);padding:7px 9px;font-size:12px}#axon-work-preview .ax-stage{min-width:0}#axon-work-preview .ax-topbar{min-height:57px;padding:14px 25px;border-bottom:1px solid var(--ax-line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}#axon-work-preview .ax-breadcrumb{color:var(--ax-muted)}#axon-work-preview .ax-preview-label{color:var(--ax-muted);border:1px solid var(--ax-line);padding:2px 8px;border-radius:5px;font-size:11px;white-space:nowrap}#axon-work-preview .ax-content{padding:25px;min-width:0}#axon-work-preview .ax-subtitle{color:var(--ax-muted);font-size:12px;margin-bottom:21px}#axon-work-preview .ax-tabs{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--ax-line);margin-bottom:18px}#axon-work-preview .ax-tab{padding:7px 0 11px;font-size:13px;position:relative;white-space:nowrap}#axon-work-preview .ax-tab[aria-pressed=true]{color:var(--ax-accent)}#axon-work-preview .ax-tab[aria-pressed=true]:after{ ems:center;color:var(--ax-muted);font-size:11px;margin-bottom:12px}#axon-work-preview .ax-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ax-accent);background:var(--ax-soft);padding:2px 7px;border-radius:4px;white-space:nowrap}#axon-work-preview .ax-badge-warn{color:var(--ax-warn);background:var(--ax-warn-bg)}#axon-work-preview .ax-muted{color:var(--ax-muted)}#axon-work-preview .ax-detail p{font-size:12px;margin-bottom:12px}#axon-work-preview .ax-result{padding:14px;background:var(--ax-side);border-radius:6px;margin:17px 0}#axon-work-preview .ax-result p:last-child{margin-bottom:0}#axon-work-preview .ax-connection{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ax-muted);margin:18px 0}#axon-work-preview .ax-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:23px}#axon-work-preview .ax-action{border:1px solid var(--ax-line)!important;border-radius:6px;padding:8px 12px!important;font-size:12px;display:inline-flex;align-items:center;gap:6px;min-height:35px}#axon-work-preview .ax-primary{background:var(--ax-button)!important;color:var(--ax-on)!important;border-color:var(--ax-button)!important}#axon-work-preview .ax-primary:hover{filter:brightness(.95)}#axon-work-preview .ax-empty{padding:25px 14px;color:var(--ax-muted);font-size:12px}#axon-work-preview .ax-detailfoot{font-size:11px;color:var(--ax-muted);margin-top:14px}#axon-work-preview .ax-small{font-size:11px}#axon-work-preview .ax-chat{max-width:560px;margin:auto;padding:3px 0}#axon-work-preview .ax-userbubble{background:var(--ax-soft);padding:12px 15px;border-radius:12px 12px 3px 12px;margin:15px 0 24px 60px;font-size:13px}#axon-work-preview .ax-agent{display:flex;align-items:center;gap:7px;margin-bottom:12px;font-weight:500;font-size:13px;color:var(--ax-accent)}#axon-work-preview .ax-chattext{font-size:13px;line-height:1.9;margin-bottom:20px}#axon-work-preview .ax-confirm{padding:17px;border:1px solid var(--ax-line);border-radius:8px;margin:17px 0}#axon-work-preview .ax-chatcomposer{margin-top:32px;border:1px solid var(--ax-line);border-radius:10px;padding:13px}#axon-work-preview textarea{width:100%;resize:vertical;min-height:45px;background:transparent;border:0;font-size:13px}#axon-work-preview .ax-composerfoot{display:flex;justify-content:space-between;align-items:center;color:var(--ax-muted);font-size:11px}#axon-work-preview .ax-chatback{margin-bottom:15px}#axon-work-preview .ax-table{border-collapse:collapse;width:100%;font-size:12px}#axon-work-preview .ax-table th{font-weight:400;text-align:left;color:var(--ax-muted);background:var(--ax-side);padding:11px 10px}#axon-work-preview .ax-table td{padding:15px 10px;border-bottom:1px solid var(--ax-line);vertical-align:top}#axon-work-preview .ax-table small{display:block;font-size:11px;color:var(--ax-muted);margin-top:4px}#axon-work-preview .ax-tablewrap{border:1px solid var(--ax-line);border-radius:8px;overflow:clip}#axon-work-preview .ax-table .ax-link{white-space:normal}#axon-work-preview .ax-overview-note{color:var(--ax-muted);font-size:11px;margin:14px 0}#axon-work-preview .ax-toast{min-height:24px;color:var(--ax-accent);font-size:12px;padding:10px 0 0}#axon-work-preview[data-density=compact] .ax-item{padding:10px 14px!important}#axon-work-preview[data-density=compact] .ax-content{padding:20px}

<div id="axon-work-preview" aria-label="Axon 席位待办设计预览">
  <div class="ax-shell">
    <aside class="ax-sidebar" aria-label="任务和对话导航"><div class="ax-brand"><i data-lucide="orbit" aria-hidden="true"></i>Axon</div><nav class="ax-mainnav" aria-label="工作入口"></nav><div class="ax-projects"></div><div class="ax-seat"><label for="ax-seat-select">预览席位 · 示例数据</label><select id="ax-seat-select"><option value="overall">总体席</option><option value="planning">筹划席</option></select></div></aside>
    <main class="ax-stage"><header class="ax-topbar"><span class="ax-breadcrumb">总体席 / 工作待办</span><span class="ax-preview-label">交互原型</span></header><div class="ax-content"></div></main>
  </div>
</div>
<script>
(()=>{
const root=document.getElementById('axon-work-preview');
const defaults={seat:'overall',page:'work',bucket:'actionable',kind:'all',selected:'road',chat:'confirm',read:false,confirmed:false,handled:false,handledPlanning:false,accepted:false,overviewTab:'work',density:'comfortable'};
let state={...defaults};
const icons=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=value=>String(value).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const seatName=()=>state.seat==='overall'?'总体席':'筹划席';
const handled=()=>state.seat==='overall'?state.handled:state.handledPlanning;
function hydrate(saved){const v=saved?.privateContent?.ui||saved?.modelContent?.preview;if(!v)return;for(const k of ['seat','page','bucket','kind','selected','chat','overviewTab','density'])if(typeof v[k]==='string')state[k]=v[k];for(const k of ['read','confirmed','handled','handledPlanning','accepted'])if(typeof v[k]==='boolean')state[k]=v[k];if(!['overall','planning'].includes(state.seat))state.seat='overall';if(!['work','overview','chat'].includes(state.page))state.page='work';if(state.seat==='planning'&&state.page==='overview')state.page='work'}
hydrate(window.openai?.widgetState);
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:{seat:state.seat,page:state.page,bucket:state.bucket,chat:state.chat,density:state.density}},privateContent:{ui:{...state}}}).catch(()=>{})}
function items(){return[{id:'road',kind:'information',title:'西区道路临时封闭通报',source:'交通信息系统',task:'西区应急保障',time:'10:24',bucket:handled()?'done':'actionable',status:handled()?'已阅处':'待阅处'},{id:'plan',kind:'work',title:'修订西区保障方案',source:state.seat==='overall'?'总体席 → 筹划席':'总体席分派',task:'西区应急保障',time:'10:18',bucket:state.accepted?'done':state.seat==='overall'?'actionable':'following',status:state.accepted?'已完成':state.seat==='overall'?'待我验收':'等待验收'},{id:'resource',kind:'work',title:'核对东区可用资源',source:state.seat==='overall'?'总体席 → 筹划席':'总体席分派',task:'东区资源保障',time:'09:50',bucket:state.seat==='overall'?'following':'actionable',status:state.seat==='overall'?'对方办理中':'办理中'},{id:'weather',kind:'information',title:'西区气象条件更新',source:'气象信息系统',task:'西区应急保障',time:'09:15',bucket:'done',status:'已阅处'}]}
function iconise(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelectorAll('button,select').forEach(x=>x.classList.add('cursor-interaction'))}
function sidebar(){const pending=items().filter(x=>x.bucket==='actionable').length;root.querySelector('.ax-mainnav').innerHTML=`<button class="ax-nav ${state.page==='work'?'ax-selected':''}" data-action="page" data-value="work" aria-current="${state.page==='work'?'page':'false'}">${icons('inbox')}<span>工作待办</span><span class="ax-count">${pending}</span></button>${state.seat==='overall'?`<button class="ax-nav ${state.page==='overview'?'ax-selected':''}" data-action="page" data-value="overview" aria-current="${state.page==='overview'?'page':'false'}">${icons('layout-dashboard')}<span>工作总览</span></button>`:''}`;
root.querySelector('.ax-projects').innerHTML=`<div class="ax-label">工作任务</div><section><div class="ax-folder">${icons('chevron-down')}${icons('folder')}西区应急保障</div><button class="ax-session ${state.page==='chat'&&state.chat==='running'?'ax-selected':''}" data-action="chat" data-value="running"><span class="ax-sessiontitle">路线调整分析</span><span class="ax-sessionstate ax-green"><span class="ax-dot"></span>处理中</span></button><button class="ax-session ${state.page==='chat'&&state.chat==='reply'?'ax-selected':''}" data-action="chat" data-value="reply"><span class="ax-sessiontitle">资源调配核对${!state.read?'<span class="ax-dot ax-blue" aria-label="新回复未读"></span>':''}</span>${!state.read?'<span class="ax-sessionstate ax-blue">新回复</span>':''}</button><button class="ax-session ${state.page==='chat'&&state.chat==='confirm'?'ax-selected':''}" data-action="chat" data-value="confirm"><span class="ax-sessiontitle">保障方案简报</span>${!state.confirmed?'<span class="ax-sessionstate ax-amber"><span class="ax-dot"></span>待确认</span>':'<span class="ax-sessionstate">已回复</span>'}</button></section><section><div class="ax-folder">${icons('chevron-down')}${icons('folder')}东区资源保障</div><button class="ax-session ${state.page==='chat'&&state.chat==='east'?'ax-selected':''}" data-action="chat" data-value="east"><span class="ax-sessiontitle">资源需求梳理</span></button></section>`;
root.querySelector('#ax-seat-select').value=state.seat;root.querySelector('.ax-breadcrumb').textContent=`${seatName()} / ${state.page==='work'?'工作待办':state.page==='overview'?'工作总览':state.chat==='east'?'东区资源保障 / 对话':'西区应急保障 / 对话'}`}
function detail(item){if(!item)return'<div class="ax-empty">选择一项工作或信息查看详情。</div>';const info=item.kind==='information';return `<div class="ax-detailtag">${icons(info?'file-text':'clipboard-check')}<span>${info?'外部信息':'工作交接'}</span><span class="ax-badge ${item.status==='待我验收'?'ax-badge-warn':''}">${item.status}</span></div><h2>${item.title}</h2><p class="ax-muted">${item.source} · 今天 ${item.time}</p>${info?`<div class="ax-result"><h3>分析结果</h3><p>${item.id==='road'?'西区主通道将于 14:00—18:00 临时封闭。建议核实备用路线通行条件，并同步调整保障车辆进场安排。':'今天下午西区有阵雨，户外保障应预留防雨物资。'}</p></div><p><span class="ax-muted">投递原因</span><br>按来源规则投递给本席位</p>`:`<div class="ax-result"><h3>${item.id==='plan'?'提交成果':'办理目标'}</h3><p>${item.id==='plan'?'西区保障方案 v2.pdf':'核对车辆、人员与物资的可用数量，汇总当前缺口。'}</p>${item.id==='plan'?'<p class="ax-muted">筹划席 · 第 2 次提交 · 10:18</p>':''}</div><p><span class="ax-muted">${item.id==='plan'?'本次说明':'承办席位'}</span><br>${item.id==='plan'?'已补充备用路线与车辆进场时间安排。':'筹划席'}</p>`}<div class="ax-connection">${icons('folder')}<span>${item.task}</span></div><div class="ax-actions">${info?`<button class="ax-action ax-primary" data-action="chat" data-value="running">${icons('message-square')}进入任务处理</button>${item.id==='road'?`<button class="ax-action" data-action="handle">${handled()?'重新列入待阅处':'标记已阅处'}</button>`:''}`:item.id==='plan'&&state.seat==='overall'&&!state.accepted?'<button class="ax-action ax-primary" data-action="accept">验收通过</button>':'<button class="ax-action ax-primary" data-action="chat" data-value="east">进入办理对话</button>'}</div>${info?'<div class="ax-detailfoot">本席位阅处状态独立于后续工作的办理进度。</div>':''}`}
function work(){const all=items();const rows=all.filter(x=>(state.bucket==='all'||x.bucket===state.bucket)&&(state.kind==='all'||x.kind===state.kind));const selected=all.find(x=>x.id===state.selected);return `<h1>工作待办</h1><p class="ax-subtitle">${seatName()} · 处理收到的信息、交接工作和需要你回应的对话</p><div class="ax-tabs" aria-label="待办状态">${[['actionable','待我处理'],['following','跟进中'],['done','已办'],['all','全部']].map(([key,label])=>`<button class="ax-tab" aria-pressed="${state.bucket===key}" data-action="bucket" data-value="${key}">${label}<span>${all.filter(x=>key==='all'||x.bucket===key).length}</span></button>`).join('')}</div>${!state.confirmed?`<div class="ax-reminder">${icons('message-circle-question')}<div class="ax-remindercopy"><strong>1 个对话需要你确认</strong><small>西区应急保障 · 保障方案简报</small></div><button class="ax-link" data-action="chat" data-value="confirm">去回应 ${icons('arrow-right')}</button></div>`:''}<div class="ax-split"><div class="ax-list"><div class="ax-listbar"><span>${rows.length} 项办理事项</span><select aria-label="事项类型" id="ax-type"><option value="all" ${state.kind==='all'?'selected':''}>全部类型</option><option value="information" ${state.kind==='information'?'selected':''}>外部信息</option><option value="work" ${state.kind==='work'?'selected':''}>工作交接</option></select></div>${rows.length?rows.map(x=>`<button class="ax-item" data-action="select" data-value="${x.id}" aria-pressed="${state.selected===x.id}"><span class="ax-itemtop"><span>${x.kind==='information'?'外部信息':'工作交接'}</span><span>${x.time}</span></span><strong>${x.title}</strong><span class="ax-itemmeta">${x.source}</span><span class="ax-badge ${x.status==='待我验收'?'ax-badge-warn':''}" style="margin-top:9px">${x.status}</span></button>`).join(''):'<div class="ax-empty">目前没有这类事项。</div>'}</div><section class="ax-detail" aria-label="办理详情">${detail(selected)}</section></div><p class="ax-toast" role="status" aria-live="polite"></p>`}
function overview(){const records=items().filter(x=>state.overviewTab==='work'?x.kind==='work':x.kind==='information');return `<h1>工作总览</h1><p class="ax-subtitle">总体席 · 查看获授权的协作进度与信息流转</p><div class="ax-tabs" aria-label="总览栏目"><button class="ax-tab" data-action="overview" data-value="work" aria-pressed="${state.overviewTab==='work'}">席位工作</button><button class="ax-tab" data-action="overview" data-value="information" aria-pressed="${state.overviewTab==='information'}">信息流转</button></div><div class="ax-tablewrap"><table class="ax-table"><thead><tr><th>${state.overviewTab==='work'?'工作 / 任务':'信息 / 来源'}</th><th>${state.overviewTab==='work'?'分派双方':'送达席位'}</th><th>更新时间</th><th>当前进度</th></tr></thead><tbody>${records.map(x=>`<tr><td><button class="ax-link" data-action="from-overview" data-value="${x.id}">${x.title}</button><small>${state.overviewTab==='work'?x.task:x.source}</small></td><td>${state.overviewTab==='work'?'总体席 → 筹划席':'总体席、筹划席'}</td><td>${x.time}</td><td><span class="ax-badge">${state.overviewTab==='work'?(x.id==='plan'?(state.accepted?'已完成':'待总体席验收'):'筹划席办理中'):'已送达'}</span>${state.overviewTab==='information'?`<small>本席位：${x.status}</small>`:''}</td></tr>`).join('')}</tbody></table></div><p class="ax-overview-note">工作进度与信息阅处分开呈现，点击查看同一事项。</p>`}
function chat(){const titles={running:'路线调整分析',reply:'资源调配核对',confirm:'保障方案简报',east:'资源需求梳理'};const title=titles[state.chat]||titles.confirm;const waiting=state.chat==='confirm'&&!state.confirmed;return `<div class="ax-chat"><button class="ax-link ax-chatback" data-action="page" data-value="work">${icons('arrow-left')}返回工作待办</button><h1>${title}</h1><p class="ax-subtitle">${state.chat==='east'?'东区资源保障':'西区应急保障'} · 本席位对话</p><div class="ax-userbubble">${state.chat==='running'?'请分析主通道封闭后，备用路线能否满足保障要求。':state.chat==='reply'?'核对调整后的车辆和人员安排，指出还需要补充的信息。':state.chat==='east'?'请梳理东区保障任务的资源需求。':'请把当前保障方案整理成简报。'}</div><div class="ax-agent">${icons('sparkles')}Axon</div><div class="ax-chattext">${state.chat==='running'?'正在核对备用路线通行条件，并对照任务中的车辆安排分析影响。':state.chat==='reply'?'已完成核对。备用路线可满足现有车辆通行条件；仍需确认两辆保障车的出发时间，避免与物资装卸时段冲突。':state.chat==='east'?'已梳理车辆、人员和物资需求，可以继续核对各项可用数量。':state.confirmed?'已按确认的使用场景继续整理简报。':'已整理好方案要点，生成简报前需要确认使用场景。'}</div>${waiting?`<div class="ax-confirm"><span class="ax-badge ax-badge-warn">待确认</span><h3 style="margin-top:12px">这份简报用于哪个场景？</h3><div class="ax-actions"><button class="ax-action ax-primary" data-action="confirm">内部协调会</button><button class="ax-action" data-action="confirm">对外情况通报</button></div></div>`:state.chat==='running'?'<p class="ax-small ax-green"><span class="ax-dot"></span> 处理中 · 正在读取任务资料</p>':''}<div class="ax-chatcomposer"><label for="ax-message" class="ax-small ax-muted">继续对话</label><textarea id="ax-message" placeholder="围绕当前任务提问…"></textarea><div class="ax-composerfoot"><span>示例对话</span><button class="ax-action" data-action="send">发送 ${icons('arrow-up')}</button></div></div><p class="ax-toast" role="status" aria-live="polite"></p></div>`}
function render(){if(state.seat==='planning'&&state.page==='overview')state.page='work';root.dataset.density=state.density;sidebar();root.querySelector('.ax-content').innerHTML=state.page==='overview'?overview():state.page==='chat'?chat():work();iconise()}
function toast(text){const node=root.querySelector('.ax-toast');if(node)node.textContent=text}
root.addEventListener('click',event=>{const target=event.target.closest('button[data-action]');if(!target||!root.contains(target))return;const a=target.dataset.action,v=target.dataset.value;let message='';if(a==='page')state.page=v;if(a==='chat'){state.page='chat';state.chat=v;if(v==='reply')state.read=true}if(a==='bucket'){state.bucket=v;state.selected=items().find(x=>(v==='all'||x.bucket===v)&&(state.kind==='all'||x.kind===state.kind))?.id||''}if(a==='select')state.selected=v;if(a==='handle'){if(state.seat==='overall')state.handled=!state.handled;else state.handledPlanning=!state.handledPlanning;message=handled()?'已标记为已阅处，可在“已办”中查看。':'已重新列入待阅处。'}if(a==='accept'){state.accepted=true;message='验收通过，工作已完成。'}if(a==='overview')state.overviewTab=v;if(a==='from-overview'){state.page='work';state.bucket='all';state.kind='all';state.selected=v}if(a==='confirm')state.confirmed=true;if(a==='send'){const text=root.querySelector('#ax-message')?.value.trim();if(!text){toast('请先输入内容。');return}message='这是交互预览，消息不会发送到实际席位。'}render();if(message)toast(message);save()});
root.addEventListener('change',event=>{if(event.target.id==='ax-seat-select'){state.seat=event.target.value;state.page='work';state.bucket='actionable';state.kind='all';state.selected='road'}if(event.target.id==='ax-type'){state.kind=event.target.value;state.selected=items().find(x=>(state.bucket==='all'||x.bucket===state.bucket)&&(state.kind==='all'||x.kind===state.kind))?.id||''}render();save()});
window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){hydrate(saved);render()}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save()}});tweak.addSelect(state,'density',{label:'列表密度',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]})}
})();
</script>
