<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>席位工作双视图 · 方案原型</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#252b32;background:#f7f8fa;font-size:14px;--accent:#426354;--line:#e0e4e9;--muted:#6c7482}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;font-size:13px}button:hover{background:#f5f7f6}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #426354;outline-offset:3px}button:disabled{cursor:default;opacity:.55}input,select{height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:white;min-width:0}select{width:160px}input{width:180px}.notice{margin:0;padding:12px 24px;background:#edf3ef;color:#426354;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}.notice a{color:inherit}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1660px;margin:0 auto;background:white;min-height:850px}.sidebar{background:#f7f8fa;border-right:1px solid var(--line);padding:28px 16px}.brand{font-size:28px;color:#203d31;margin:0 12px 32px}.nav-item{display:block;padding:14px 12px;margin-bottom:10px;border-radius:8px;font-weight:500}.nav-item.active{color:#426354;background:#e8eee9}.section-label{margin:28px 12px 12px;color:var(--muted)}.task{padding:12px;font-size:13px}.task small{display:block;margin-top:8px;color:var(--muted)}main{min-width:0}.page-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 26px 24px;min-height:40px}h1{font-size:24px;line-height:36px;margin:0;letter-spacing:-.5px;font-weight:600}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.switch{display:inline-flex}.switch button{border-radius:0}.switch button:first-child{border-radius:8px 0 0 8px}.switch button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}.switch button[aria-pressed=true]{color:#426354;background:#e8eee9;border-color:#b9cbbf;position:relative}.tabs{display:flex;flex-wrap:wrap;gap:26px;padding:0 26px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.tabs span{padding:15px 0}.tabs .active{color:#426354;border-bottom:3px solid #426354;font-weight:600}.content{padding:20px 26px}.filters{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:18px}.filters label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}.count{color:var(--muted);font-size:12px;margin:0 0 14px}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:850px;border-collapse:collapse;text-align:left;font-size:13px}th{background:#f8f9fa;color:var(--muted);font-weight:500;white-space:nowrap}th,td{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}td:first-child{min-width:185px}td:nth-child(2){min-width:185px}td small{display:block;color:var(--muted);margin-top:7px;font-size:12px}.work-link{border:0;background:transparent;min-height:24px;padding:0;text-align:left;color:var(--accent);font-weight:500;line-height:1.6}.status{font-size:12px;display:inline-block;padding:3px 7px;border-radius:5px;background:#f3f5f6;color:#505963;white-space:nowrap}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.graph-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}.graph-viewport{overflow:auto;min-height:630px;max-height:760px;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.graph-size{position:relative}.graph-layer{position:absolute;inset:0 auto auto 0;width:760px;height:840px;transform-origin:0 0}.connections{position:absolute;inset:0;pointer-events:none}.connections path{fill:none;stroke:#a3afa9;stroke-width:1.7}.connections marker path{fill:#7e9187;stroke:none}.node{position:absolute;width:120px;height:64px;border-color:#bdccc3;background:#f0f5f2;color:#355646;font-size:15px;font-weight:600;z-index:2}.node.picked{outline:2px solid #426354;outline-offset:2px}.edge-group{position:absolute;left:180px;width:390px;min-height:102px;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;z-index:1}.edge-group.dimmed,.connections .dimmed{opacity:.3}.edge-group .direction{color:var(--muted);font-size:12px;margin-bottom:6px}.edge-work{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;padding:4px 0}.edge-work .work-link{font-size:13px}.edge-work small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.more{border:0;background:none;color:var(--accent);min-height:28px;padding:2px 0;font-size:12px}.legend{color:var(--muted);font-size:12px;margin:12px 0 0}dialog{width:min(620px,90vw);padding:24px;border:1px solid var(--line);border-radius:12px;color:inherit}dialog::backdrop{background:#17231a55}.dialog-header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}h2{font-size:20px;margin:0}dl{display:grid;grid-template-columns:95px minmax(0,1fr);gap:16px 20px;margin:0}dt{color:var(--muted)}dd{margin:0}.dialog-list{display:grid;gap:16px}.dialog-list article{padding-bottom:16px;border-bottom:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:1100px){.shell{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:24px 10px}.page-header{margin-right:20px;margin-left:20px}.tabs{padding:0 20px;gap:18px}.content{padding:20px}.filters{gap:12px 20px}}
</style>
</head>
<body>
<p class="notice"><span>方案原型 · 合成数据 · 尚未实施</span><a href="../design.md">查看设计说明</a></p>
<div class="shell">
<aside class="sidebar" aria-label="应用结构示意"><div class="brand">Axon</div><span class="nav-item">新建对话</span><span class="nav-item">工作待办</span><span class="nav-item active">工作总览</span><span class="nav-item">态势地图</span><div class="section-label">工作任务</div><div class="task">道路通行保障<small>信息、对话与工作成果</small></div><div class="task">应急处置协调</div><div class="task">物资与资源保障</div><div class="section-label">个人空间</div></aside>
<main><header class="page-header"><h1>工作总览</h1><div class="actions"><div class="switch" role="group" aria-label="席位工作视图"><button id="list-view" type="button" aria-pressed="true">列表</button><button id="flow-view" type="button" aria-pressed="false">流程图</button></div><button id="refresh" type="button">刷新工作</button></div></header>
<nav class="tabs" aria-label="总览栏目结构示意"><span>研判记录</span><span class="active" aria-current="page">席位工作</span><span>信息流转</span><span>处理运行</span><span>处理与投递规则</span><span>补充投递审批</span></nav>
<section class="content" aria-label="席位工作"><div class="filters"><label>工作任务<select id="task"><option value="">全部公共任务</option><option>道路通行保障</option><option>应急处置协调</option><option>物资与资源保障</option></select></label><label>相关席位<select id="seat"><option value="">全部席位</option><option>总体席</option><option>情报席</option><option>筹划席</option><option>态势席</option></select></label><label>工作状态<select id="status"><option value="">全部状态</option><option>待签收</option><option>办理中</option><option>待验收</option><option>已退回</option><option>已完成</option></select></label><label>搜索工作<input id="search" type="search"></label></div>
<p class="count" id="count" role="status" aria-live="polite"></p>
<div id="list-panel"><div class="table-scroll"><table><thead><tr><th>工作</th><th>分派双方</th><th>当前状态</th><th>下一步</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div id="flow-panel" hidden><div class="graph-tools" role="group" aria-label="流转图控制"><button id="zoom-out" type="button" aria-label="缩小流转图">缩小</button><button id="zoom-in" type="button" aria-label="放大流转图">放大</button><button id="fit" type="button">适应视图</button></div><div class="graph-viewport" id="graph-viewport" role="region" aria-label="席位之间的工作分派关系"><div class="graph-size" id="graph-size"><div class="graph-layer" id="graph-layer"></div></div></div><p class="legend">箭头：发起席位 → 承办席位 · 点击工作查看摘要</p></div>
<div class="empty" id="empty" hidden>暂无符合条件的工作。</div>
</section></main></div>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title"></h2><button id="close" type="button">关闭</button></div><div id="detail-body"></div></dialog>
<script>
const names={A:'总体席',B:'情报席',C:'筹划席',D:'态势席'};
const data=[
{id:'w1',title:'整理处置资料',task:'道路通行保障',from:'A',to:'B',state:'待签收'},
{id:'w2',title:'核实现场联络方式',task:'应急处置协调',from:'A',to:'B',state:'已完成'},
{id:'w3',title:'复核新的道路来报',task:'道路通行保障',from:'A',to:'B',state:'办理中'},
{id:'w4',title:'核对道路保障安排',task:'道路通行保障',from:'B',to:'A',state:'待签收'},
{id:'w5',title:'复核物资清单',task:'物资与资源保障',from:'B',to:'A',state:'办理中'},
{id:'w6',title:'完善备用路线方案',task:'道路通行保障',from:'A',to:'C',state:'办理中'},
{id:'w7',title:'汇总联合处置意见',task:'应急处置协调',from:'A',to:'C',state:'已完成'},
{id:'w8',title:'补充资源调配建议',task:'物资与资源保障',from:'C',to:'A',state:'已退回'},
{id:'w9',title:'更新现场道路态势',task:'道路通行保障',from:'A',to:'D',state:'待验收'}
];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='list',zoom=1,highlight='';
const next=w=>w.state==='已完成'?'已完成':`${names[w.state==='待验收'?w.from:w.to]}${w.state==='待签收'?'签收':w.state==='待验收'?'验收':w.state==='已退回'?'修改':'办理'}`;
const filtered=()=>data.filter(w=>(!$('task').value||w.task===$('task').value)&&(!$('seat').value||[names[w.from],names[w.to]].includes($('seat').value))&&(!$('status').value||w.state===$('status').value)&&w.title.includes($('search').value.trim()));
function openWork(id){const w=data.find(w=>w.id===id);$('detail-title').textContent=w.title;$('detail-body').innerHTML=`<dl><dt>所属任务</dt><dd>${esc(w.task)}</dd><dt>发起席位</dt><dd>${names[w.from]}</dd><dt>承办席位</dt><dd>${names[w.to]}</dd><dt>当前状态</dt><dd>${w.state}</dd><dt>下一步</dt><dd>${next(w)}</dd><dt>更新时间</dt><dd>2026/11/4 11:20:23</dd></dl>`;$('detail').showModal();}
function openGroup(items){$('detail-title').textContent=`${names[items[0].from]} → ${names[items[0].to]} · ${items.length} 项工作`;$('detail-body').innerHTML=`<div class="dialog-list">${items.map(w=>`<article><button type="button" class="work-link" data-group-work="${w.id}">${esc(w.title)}</button><p>${esc(w.task)} · ${w.state} · ${next(w)}</p></article>`).join('')}</div>`;$('detail-body').querySelectorAll('[data-group-work]').forEach(b=>b.onclick=()=>{$('detail').close();openWork(b.dataset.groupWork)});$('detail').showModal();}
function workHtml(w){return `<div class="edge-work"><div><button class="work-link" type="button" data-work="${w.id}">${esc(w.title)}</button><small>${esc(w.task)}</small></div><span class="status">${w.state}</span></div>`;}
const graphGroups=[
{key:'A-B',y:16,path1:'M140 400 C160 400 155 100 180 100',path2:'M570 100 C590 100 595 112 620 112'},
{key:'B-A',y:210,path1:'M620 132 C590 132 595 280 570 280',path2:'M180 280 C155 280 160 420 140 420'},
{key:'A-C',y:380,path1:'M140 430 C155 430 160 450 180 450',path2:'M570 450 C590 450 595 502 620 502'},
{key:'C-A',y:550,path1:'M620 522 C595 522 595 600 570 600',path2:'M180 600 C155 600 160 440 140 440'},
{key:'A-D',y:680,path1:'M140 450 C160 450 155 730 180 730',path2:'M570 730 C590 730 595 762 620 762'}
];
const nodePositions={A:[20,390],B:[620,80],C:[620,470],D:[620,730]};
function renderGraph(items){const activeNodes=new Set(items.flatMap(w=>[w.from,w.to]));const groups=graphGroups.map(g=>({...g,items:items.filter(w=>`${w.from}-${w.to}`===g.key)})).filter(g=>g.items.length);const opacity=g=>highlight&&!g.key.split('-').includes(highlight)?'dimmed':'';
$('graph-layer').innerHTML=`<svg class="connections" width="760" height="840" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z"/></marker></defs>${groups.map(g=>`<g class="${opacity(g)}"><path d="${g.path1}"/><path d="${g.path2}" marker-end="url(#arrow)"/></g>`).join('')}</svg>${[...activeNodes].map(n=>`<button type="button" class="node ${highlight===n?'picked':''}" aria-pressed="${highlight===n}" data-node="${n}" style="left:${nodePositions[n][0]}px;top:${nodePositions[n][1]}px">${names[n]}</button>`).join('')}${groups.map(g=>`<section class="edge-group ${opacity(g)}" aria-label="${names[g.items[0].from]}分派给${names[g.items[0].to]}的工作" style="top:${g.y}px"><div class="direction">${names[g.items[0].from]} → ${names[g.items[0].to]} · ${g.items.length} 项</div>${g.items.slice(0,2).map(workHtml).join('')}${g.items.length>2?`<button type="button" class="more" data-group="${g.key}">另 ${g.items.length-2} 项，查看全部</button>`:''}</section>`).join('')}`;
$('graph-layer').querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openWork(b.dataset.work));$('graph-layer').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>openGroup(groups.find(g=>g.key===b.dataset.group).items));$('graph-layer').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{highlight=highlight===b.dataset.node?'':b.dataset.node;renderGraph(items);$('graph-layer').querySelector(`[data-node="${b.dataset.node}"]`).focus()});applyZoom();}
function applyZoom(){$('graph-size').style.width=760*zoom+'px';$('graph-size').style.height=840*zoom+'px';$('graph-layer').style.transform=`scale(${zoom})`;}
function render(){const items=filtered();$('count').textContent=`共 ${items.length} 项工作`;$('empty').hidden=!!items.length;$('list-panel').hidden=view!=='list'||!items.length;$('flow-panel').hidden=view!=='flow'||!items.length;$('list-view').setAttribute('aria-pressed',String(view==='list'));$('flow-view').setAttribute('aria-pressed',String(view==='flow'));$('rows').innerHTML=items.map(w=>`<tr><td><button type="button" class="work-link" data-row-work="${w.id}">${esc(w.title)}</button><small>${esc(w.task)}</small></td><td>${names[w.from]} → ${names[w.to]}</td><td><span class="status">${w.state}</span></td><td>${next(w)}</td><td>2026/11/4<br>11:20:23</td></tr>`).join('');$('rows').querySelectorAll('[data-row-work]').forEach(b=>b.onclick=()=>openWork(b.dataset.rowWork));renderGraph(items);}
$('list-view').onclick=()=>{view='list';render()};$('flow-view').onclick=()=>{view='flow';render()};$('refresh').onclick=()=>render();for(const id of ['task','seat','status','search'])$(id).addEventListener('input',()=>{highlight='';render()});$('zoom-in').onclick=()=>{zoom=Math.min(1.5,zoom+.1);applyZoom()};$('zoom-out').onclick=()=>{zoom=Math.max(.7,zoom-.1);applyZoom()};$('fit').onclick=()=>{zoom=Math.min(1,Math.max(.7,($('graph-viewport').clientWidth-20)/760));applyZoom();$('graph-viewport').scrollTo(0,0)};$('close').onclick=()=>$('detail').close();render();
</script>
</body></html>
