name: 发布沙盒镜像

on:
  workflow_dispatch:
  push:
    tags: ['sandbox-image-v*', 'sandbox-verify-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !startsWith(github.ref, 'refs/tags/sandbox-verify-v') }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/pulpcode/berserk-file-runtime
    defaults:
      run:
        working-directory: experiments/harness-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: 安装探针依赖
        run: npm ci
      - name: 构建并验证镜像
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" execution-image
          EXECUTION_IMAGE="$IMAGE:sha-$GITHUB_SHA" npm run probe:execution
      - name: 推送并输出部署绑定
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:sha-$GITHUB_SHA"
          docker push "$tag"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" |
            awk -v prefix="$IMAGE@" 'index($0, prefix) == 1 { print; exit }')
          [[ $reference =~ @sha256:[a-f0-9]{64}$ ]]
          {
            printf '构建提交：`%s`\n\n' "$GITHUB_SHA"
            printf '```json\n{\n  "image": "%s",\n  "platform": "linux/amd64"\n}\n```\n' "$reference"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-pull:
    if: startsWith(github.ref, 'refs/tags/sandbox-verify-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/harness-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - name: 验证匿名拉取和已发布镜像
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          image=$(node -p 'require("../../release/sandbox-image.json").image')
          cleanup() {
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup EXIT
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo '验收需要全新镜像缓存。' >&2
            exit 1
          fi
          node --import tsx scripts/deploy-preflight.ts
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{json .RepoDigests}}' "$image"
          touch ../../release/.managed-deployment
          trap 'rm -f -- ../../release/.managed-deployment; cleanup' EXIT
          effective=$(node --import tsx --input-type=module -e '
            import { managedSandboxReleaseEnv } from "./src/server/sandbox-release.ts";
            console.log(managedSandboxReleaseEnv().LAB_EXECUTION_IMAGE);
          ')
          test "$effective" = "$image"
          EXECUTION_IMAGE="$effective" npm run probe:execution
          node --import tsx scripts/deploy-preflight.ts
